name: Release

on:
  push:
    tags:
      # Two version lines. `v0.48.0` releases the Iyu.* packages that share one number; `lowline-v0.48.0`
      # releases Iyu.Lowline, which is versioned on its own (src/Iyu.Lowline/Directory.Build.props).
      - 'v*'
      - 'lowline-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the "Packages affected" check below diffs this release against
      # the previous one, which a shallow checkout cannot express.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Extract line and version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            lowline-v*) LINE=lowline; TAG_VERSION="${GITHUB_REF_NAME#lowline-v}"; PROPS=src/Iyu.Lowline/Directory.Build.props ;;
            *)          LINE=core;    TAG_VERSION="${GITHUB_REF_NAME#v}";         PROPS=Directory.Build.props ;;
          esac
          {
            echo "line=$LINE"
            echo "tag_version=$TAG_VERSION"
            echo "props=$PROPS"
          } >> "$GITHUB_OUTPUT"
          echo "Line: $LINE  Tag version: $TAG_VERSION  Props: $PROPS"

      - name: Verify the line's props version matches tag
        run: |
          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' "${{ steps.version.outputs.props }}")
          echo "Props version: $PROPS_VERSION"
          echo "Tag version:   ${{ steps.version.outputs.tag_version }}"
          if [ "$PROPS_VERSION" != "${{ steps.version.outputs.tag_version }}" ]; then
            echo "::error::Version mismatch: tag=${{ steps.version.outputs.tag_version }}, ${{ steps.version.outputs.props }}=$PROPS_VERSION"
            exit 1
          fi

      # CHANGELOG.md ships inside every package and its headnote promises that a package absent
      # from a release's "Packages affected" line changed nothing the consumer depends on. That
      # line is hand-maintained and has been wrong. The check runs here, before Pack, because a
      # wrong list caught after publishing is already on nuget.org.
      # The check covers the shared-number line; Iyu.Lowline's own line has one package and its own changelog.
      - name: Packages affected matches the release diff
        if: steps.version.outputs.line == 'core'
        run: .github/scripts/packages-affected.sh released

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore IyuFramework.slnx

      - name: Build
        run: dotnet build IyuFramework.slnx -c Release --no-restore

      - name: Test
        run: dotnet test IyuFramework.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack IyuFramework.slnx -c Release --no-build -p:IyuPackLine=${{ steps.version.outputs.line }} -o ./artifacts

      # The push itself runs in the organization's central publish workflow, which holds the
      # only NuGet trust policy; this repository holds no NuGet credential. Only the packed
      # files go up, and they are kept for one day.
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit
